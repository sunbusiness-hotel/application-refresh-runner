name: Refresh published application data
on:
  workflow_dispatch:
    inputs:
      fresh_session:
        type: boolean
        default: false
  schedule:
    - cron: '3-58/5 * * * *'
    - cron: '0 16 * * *'
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Refresh application
        env:
          APP_URL: ${{ secrets.APP_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          APP_FORCE_LOGIN: ${{ inputs.fresh_session && '1' || '0' }}
        run: |
          python3 - <<'PY'
          import io, os, subprocess, tempfile, urllib.request, zipfile
          request = urllib.request.Request(
              os.environ['APP_URL'] + '/internal/collector.zip',
              headers={'Authorization': 'Bearer ' + os.environ['APP_TOKEN'],
                       'User-Agent': 'application-refresh/1.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              source = response.read()
          with tempfile.TemporaryDirectory() as directory:
              zipfile.ZipFile(io.BytesIO(source)).extractall(directory)
              subprocess.run(['python3', directory + '/cloud_collect.py'], check=True,
                             timeout=180, cwd=directory)
          PY
      - name: Record daily completion
        env:
          REFRESH_REPO: ${{ github.repository }}
          REFRESH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, urllib.request, urllib.error
          url = 'https://api.github.com/repos/' + os.environ['REFRESH_REPO'] + '/contents/last-success.txt'
          headers = {'Authorization': 'Bearer ' + os.environ['REFRESH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}
          content = (datetime.datetime.now(datetime.timezone.utc).date().isoformat() + '\n').encode()
          update = {'message': 'Record daily application refresh',
                    'content': base64.b64encode(content).decode()}
          try:
              prior = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=headers)))
              if base64.b64decode(prior['content']) == content:
                  raise SystemExit(0)
              update['sha'] = prior['sha']
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(update).encode(),
                                 headers=headers, method='PUT')).close()
          PY
