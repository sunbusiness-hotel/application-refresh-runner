name: Refresh stock feed
on:
  workflow_dispatch:
    inputs:
      scheduled_at:
        type: string
        default: ''
      scope:
        type: choice
        options: [near, full]
        default: near
permissions:
  contents: read
concurrency:
  group: stock-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Ensure patched Chrome
        run: |
          installed=$(google-chrome --version | awk '{print $3}')
          if ! dpkg --compare-versions "$installed" ge '158.0.8127.88'; then
            archive="$RUNNER_TEMP/security-chrome.zip"
            curl --fail --location --retry 2 --max-time 90 --output "$archive" \
              'https://storage.googleapis.com/chrome-for-testing-public/158.0.8127.88/linux64/chrome-linux64.zip'
            echo "59e3b43f8b3aaa292238fbdcfb36a93127debd53e212510dcdc2cc8812b4b57e  $archive" | sha256sum --check --status
            unzip -q "$archive" -d "$RUNNER_TEMP/security-chrome"
            sudo ln -sfn "$RUNNER_TEMP/security-chrome/chrome-linux64/chrome" /usr/bin/google-chrome
          fi
          google-chrome --version
          python3 --version
      - name: Refresh private stock feed
        env:
          STOCK_URL: ${{ secrets.STOCK_URL }}
          STOCK_TOKEN: ${{ secrets.STOCK_TOKEN }}
          STOCK_SCOPE: ${{ inputs.scope }}
          STOCK_SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: |
          python3 - <<'PY'
          import io, os, subprocess, tempfile, urllib.request, zipfile
          try:
              req = urllib.request.Request(os.environ['STOCK_URL'] + '/internal/source.zip',
                  headers={'Authorization': 'Bearer ' + os.environ['STOCK_TOKEN'], 'User-Agent': 'application-refresh/1.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  source = response.read()
              with tempfile.TemporaryDirectory() as directory:
                  zipfile.ZipFile(io.BytesIO(source)).extractall(directory)
                  subprocess.run(['npm', 'ci', '--ignore-scripts', '--silent'], cwd=directory,
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=45)
                  subprocess.run(['python3', 'run.py'], cwd=directory, check=True, timeout=220)
          except Exception:
              print('Stock refresh failed; previous verified feed retained')
              raise SystemExit(1)
          PY
      - name: Verify sheet synchronization
        env:
          SHEET_SYNC_URL: ${{ secrets.SHEET_SYNC_URL }}
          SHEET_SYNC_TOKEN: ${{ secrets.SHEET_SYNC_TOKEN }}
          SHEET_SYNC_SOURCE: stock
        run: python3 sync-sheet.py
