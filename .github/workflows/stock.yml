name: Refresh stock feed
on:
  workflow_dispatch:
    inputs:
      scheduled_at:
        type: string
        default: ''
      scope:
        type: choice
        options: [near, full]
        default: near
permissions:
  contents: read
concurrency:
  group: stock-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Refresh private stock feed
        env:
          STOCK_URL: ${{ secrets.STOCK_URL }}
          STOCK_TOKEN: ${{ secrets.STOCK_TOKEN }}
          STOCK_SCOPE: ${{ inputs.scope }}
          STOCK_SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: |
          python3 - <<'PY'
          import io, os, subprocess, tempfile, urllib.request, zipfile
          try:
              req = urllib.request.Request(os.environ['STOCK_URL'] + '/internal/source.zip',
                  headers={'Authorization': 'Bearer ' + os.environ['STOCK_TOKEN'], 'User-Agent': 'application-refresh/1.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  source = response.read()
              with tempfile.TemporaryDirectory() as directory:
                  zipfile.ZipFile(io.BytesIO(source)).extractall(directory)
                  subprocess.run(['npm', 'ci', '--ignore-scripts', '--silent'], cwd=directory,
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=45)
                  subprocess.run(['python3', 'run.py'], cwd=directory, check=True, timeout=220)
          except Exception:
              print('Stock refresh failed; previous verified feed retained')
              raise SystemExit(1)
          PY
